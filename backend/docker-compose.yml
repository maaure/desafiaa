# O HTTPS fica com o Caddy compartilhado da VPS (/opt/caddy), que alcança
# desafia-api e desafia-frontend pela rede "web". Nenhuma porta é publicada no host.
services:
  postgres:
    container_name: desafia-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quizpass}
      POSTGRES_DB: quizplatform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quizplatform"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    container_name: desafia-redis
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    container_name: desafia-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [default, web]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://quiz:${DB_PASSWORD:-quizpass}@postgres:5432/quizplatform
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?defina GOOGLE_CLIENT_ID no .env}
      HOST: "0.0.0.0"
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  frontend:
    container_name: desafia-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # VITE_* é build-time — entra no bundle do botão Google
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?defina GOOGLE_CLIENT_ID no .env}
    restart: unless-stopped
    networks: [web]
    environment:
      # adapter-node atrás de proxy: sem isso $page.url.origin vira http://desafia-frontend:3001 (og:image quebra)
      ORIGIN: ${ORIGIN:-https://desafia.fun}
    depends_on:
      - app

networks:
  web:
    external: true

volumes:
  pgdata:
  uploads:
