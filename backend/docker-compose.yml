services:
  postgres:
    container_name: desafia-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quizpass}
      POSTGRES_DB: quizplatform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quizplatform"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    container_name: desafia-redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    container_name: desafia-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3100:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://quiz:${DB_PASSWORD:-quizpass}@postgres:5432/quizplatform
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      HOST: "0.0.0.0"
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  frontend:
    container_name: desafia-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - app
    # Proxy reverso: Caddy na VPS (ver Caddyfile). As portas 80/443 ficam com o Caddy.

volumes:
  pgdata:
  uploads:
