name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: ${{ matrix.package }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: ${{ matrix.package }}
        run: pnpm typecheck

      - name: Lint
        working-directory: ${{ matrix.package }}
        run: pnpm lint

      - name: Format check
        working-directory: ${{ matrix.package }}
        run: pnpm format:check
