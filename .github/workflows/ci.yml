name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: ${{ matrix.package }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: ${{ matrix.package }}
        run: pnpm typecheck

      - name: Lint
        working-directory: ${{ matrix.package }}
        run: pnpm lint

      - name: Format check
        working-directory: ${{ matrix.package }}
        run: pnpm format:check

  test-backend:
    runs-on: ubuntu-latest
    needs: validate

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quizpass
          POSTGRES_DB: quizplatform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz -d quizplatform_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        working-directory: backend
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://quiz:quizpass@localhost:5432/quizplatform_test

      - name: Run tests
        working-directory: backend
        run: pnpm test
        env:
          DATABASE_URL: postgres://quiz:quizpass@localhost:5432/quizplatform_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret-minimo-32-caracteres!!1
          JWT_REFRESH_SECRET: ci-refresh-secret-minimo-32-char!
